[project]
name = "backend"
version = "0.1.0"
description = "API del directorio de alojamiento estudiantil ROOMI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "pyjwt>=2.12,<3",
    "pyodbc>=5.3,<6",
    "python-dotenv",
    "uvicorn>=0.32,<1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
