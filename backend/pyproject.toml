[project]
name = "backend"
version = "0.1.0"
description = "API del directorio de alojamiento estudiantil ROOMI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
sqlserver = ["pyodbc>=5.3,<6"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
