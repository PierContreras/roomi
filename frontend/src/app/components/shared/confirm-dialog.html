<dialog #dialog class="roomi-alert native-confirm" aria-labelledby="confirm-heading" aria-describedby="confirm-description" (close)="closed.emit()">
  <span class="confirm-icon" [class.danger]="danger()" aria-hidden="true">!</span>
  <h2 id="confirm-heading">{{ heading() }}</h2>
  <div id="confirm-description"><ng-content /></div>
  <div class="actions">
    <button type="button" class="button quiet" autofocus (click)="close()">Cancelar</button>
    <button type="button" class="button" [class.danger]="danger()" (click)="close(true)">{{ approve() }}</button>
  </div>
</dialog>
