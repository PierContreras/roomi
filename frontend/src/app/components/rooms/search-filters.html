<form class="panel filters" aria-label="Buscar habitaciones" #form="ngForm"
  (ngSubmit)="form.valid ? applied.emit(draft) : expanded.set(true)">
  <div class="essential">
    <label><span class="filter-label"><app-ui-icon name="campus" /> Universidad</span>
      <select class="form-select" name="universidad" [(ngModel)]="draft.university">
        <option value="">Todas</option>
        @for (university of universities; track university) { <option [value]="university">{{ university }}</option> }
      </select>
    </label>
    <label><span class="filter-label"><app-ui-icon name="pin" /> Zona</span>
      <select class="form-select" name="zona" [(ngModel)]="draft.zone">
        <option value="">Todas</option>
        @for (zone of zones; track zone) { <option [value]="zone">{{ zone }}</option> }
      </select>
    </label>
    <button type="submit" class="button"><app-ui-icon name="search" /> {{ expanded() ? 'Aplicar filtros' : 'Buscar habitaciones' }}</button>
    <button type="button" class="button secondary filter-toggle" [attr.aria-expanded]="expanded()" aria-controls="advanced-filters"
      (click)="expanded.update(open => !open)"><app-ui-icon name="filters" /> {{ expanded() ? 'Menos filtros' : 'Más filtros' }}</button>
  </div>
  <div class="advanced" id="advanced-filters" [hidden]="!expanded()">
    <div class="form-grid">
      <label>Precio máximo (S/)
        <input class="form-control" type="number" name="precio" min="0" [(ngModel)]="draft.maxPrice" #price="ngModel" />
        @if (price.invalid) { <span class="error">Ingresa un precio desde S/ 0.</span> }
      </label>
      <label>Tiempo máximo al campus (min)
        <input class="form-control" type="number" name="tiempo" min="0" step="1" [pattern]="wholeMinutes" [(ngModel)]="draft.maxMinutes" #minutes="ngModel" />
        @if (minutes.invalid) { <span class="error">Ingresa un número entero desde 0 minutos.</span> }
      </label>
      <label>Distancia máxima al campus (km)
        <input class="form-control" type="number" name="distancia" min="0" max="100" step="any" [(ngModel)]="draft.maxDistance" #distance="ngModel" />
        @if (distance.invalid) { <span class="error">Ingresa entre 0 y 100 km.</span> }
      </label>
      <label>Tipo de alojamiento
        <select class="form-select" name="tipo" [(ngModel)]="draft.type">
          <option value="">Todos los tipos</option>
          @for (type of types; track type) { <option [value]="type">{{ type }}</option> }
        </select>
      </label>
    </div>
    <fieldset>
      <legend>Servicios</legend>
      <div class="chips">
        @for (amenity of amenities; track amenity) {
          <label class="check"><input type="checkbox" [checked]="draft.amenities.includes(amenity)"
            (change)="toggleAmenity(amenity, $any($event.target).checked)" /> {{ amenity }}</label>
        }
      </div>
    </fieldset>
  </div>
</form>
