<article class="panel room-card" [class.has-photo]="room().photos.length">
  @if (room().photos[0]; as photo) {
    <a class="cover" [routerLink]="['/habitaciones', room().id]" [queryParams]="detailQuery()" tabindex="-1" aria-hidden="true">
      <img [src]="photo.src" [alt]="photo.alt" loading="lazy" />
    </a>
  }
  <div class="card-body">
    <div class="card-top">
      <p class="location small"><app-ui-icon name="pin" /> {{ room().zone }}</p>
      <button type="button" class="button quiet favorite" [attr.aria-pressed]="saved()"
        [attr.aria-label]="'Guardar ' + room().title" [title]="saved() ? 'Quitar de guardados' : 'Guardar habitación'"
        (click)="saveToggled.emit(room().id)">
        <app-ui-icon name="heart" [filled]="saved()" /><span class="sr-only">{{ saved() ? 'Guardado' : 'Guardar' }}</span>
      </button>
    </div>
    <h3>{{ room().title }}</h3>
    <p class="muted small"><app-ui-icon name="clock" /> {{ room().minutes }} min al campus {{ room().university }}</p>
    <p>{{ room().description }}</p>
    @if (room().amenities.length) {
      <p class="muted small">{{ room().amenities.join(', ') }}</p>
    }
    <p class="price"><strong>S/ {{ room().price }}</strong><span class="muted small"> al mes</span></p>
    <div class="card-actions">
      <a class="button secondary" [routerLink]="['/habitaciones', room().id]" [queryParams]="detailQuery()">Ver anuncio<span class="sr-only"> de {{ room().title }}</span></a>
    </div>
  </div>
</article>
