<section aria-label="Galería de la habitación">
  @if (photos()[index()]; as photo) {
    <img [src]="photo.src" [alt]="photo.alt" />
    @if (photo.illustrative) { <p class="small muted">Imagen ilustrativa del anuncio de demostración.</p> }
    @if (photos().length > 1) {
      <div class="controls" role="group" aria-label="Cambiar fotografía">
        <button type="button" class="button secondary" (click)="move(-1)"><app-ui-icon name="chevronLeft" /> Anterior</button>
        <span class="small muted" role="status">Foto {{ index() + 1 }} de {{ photos().length }}</span>
        <button type="button" class="button secondary" (click)="move(1)">Siguiente <app-ui-icon name="chevronRight" /></button>
      </div>
    }
  } @else {
    <p class="no-photo muted small"><app-ui-icon name="photo" /> Este anuncio aún no tiene fotos.</p>
  }
</section>
