<section aria-label="Galería de la habitación">
  @if (photos()[index()]; as photo) {
    <img [src]="photo.src" [alt]="photo.alt" />
    @if (photos().length > 1) {
      <div class="actions" aria-label="Seleccionar fotografía">
        @for (item of photos(); track $index) {
          <button type="button" class="button secondary" [attr.aria-pressed]="index() === $index" (click)="index.set($index)">Foto {{ $index + 1 }}</button>
        }
      </div>
    }
  } @else {
    <div class="photo-placeholder">Fotografías referenciales no disponibles</div>
  }
</section>
